<style>
:root{--bg:#fff;--sf:#fff;--tx:#13202b;--mu:#5b6a77;--ac:#0e7490;--ac2:#e0f2f7;--ln:#d6dce2;--desk:#c7ced6;--dn:#b91c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Readex Pro",Tahoma,system-ui,sans-serif;font-size:15px;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer;touch-action:manipulation}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.screen{height:100%}
#home{overflow:auto;padding:20px 16px 40px;max-width:820px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px}
.sub{color:var(--mu);margin:0 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.last{display:block;width:100%;text-align:start;background:var(--ac);color:#fff;border:0;border-radius:16px;padding:18px;margin:0 0 20px}
.last small{opacity:.85;display:block;margin-bottom:4px}
.last b{font-size:20px}
.list{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.card .go{flex:1;text-align:start;background:none;border:0;padding:0}
.card b{display:block;font-size:16px}
.card span{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.del{color:var(--dn);border-color:transparent;background:none;padding:6px 10px}
#viewer{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto;flex:none}
.bar button{flex:none;padding:6px 10px}
#ttl{flex:1;min-width:90px;font:inherit;font-weight:600;color:var(--tx);background:none;border:0;padding:6px;-webkit-user-select:text;user-select:text}
.sep{width:1px;height:22px;background:var(--ln);flex:none;margin:0 2px}
.dot{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--ln)}
.dot.on{border-color:var(--tx)}
#zv{min-width:52px}
.main{flex:1;display:flex;min-height:0;position:relative}
#side{width:92px;flex:none;overflow-y:auto;background:var(--sf);border-inline-end:1px solid var(--ln);padding:6px}
@media(min-width:760px){#side{width:128px}}
.th{display:block;width:100%;background:none;border:2px solid transparent;padding:3px;border-radius:8px;margin-bottom:6px;text-align:center}
.th.on{border-color:var(--ac)}
.th canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 0 0 1px var(--ln)}
.th span{font-size:11px;color:var(--mu)}
#scroll{flex:1;overflow:auto;background:var(--desk);direction:ltr;touch-action:none;position:relative}
#pages{position:relative;width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none}
.pg canvas{width:100%;height:100%;display:block;touch-action:none}
#pgno{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;pointer-events:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:rgba(20,28,36,.92);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(380px,100%);background:var(--sf);border-inline-start:1px solid var(--ln);z-index:5;display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.3)}
.tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--ln)}
.tab{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#panel textarea,#panel input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text;width:100%}
#panel textarea{flex:1;min-height:180px;resize:none}
.srch-results{display:grid;gap:8px;overflow:auto;min-height:0}
.srch-hit{border:1px solid var(--ln);border-radius:12px;padding:9px;display:grid;gap:7px}
.srch-meta{font-size:12px;color:var(--mu)}
.srch-snippet{direction:auto;unicode-bidi:plaintext;text-align:start;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.srch-snippet mark{background:#fde68a;color:#111;border-radius:3px;padding:0 1px}
.srch-actions{display:flex;gap:6px;flex-wrap:wrap}
.srch-full{border-top:1px solid var(--ln);padding-top:8px}
.srch-full summary{cursor:pointer;color:var(--ac);font-size:13px}
.srch-full textarea{min-height:100px!important;max-height:35vh;flex:none!important}
.srch-empty{color:var(--mu);font-size:13px;padding:8px 2px}
#mkcard:disabled{opacity:.55;cursor:not-allowed}
.cd{display:flex;flex-direction:column;gap:2px;border:1px solid var(--ln);border-radius:10px;padding:8px}
.rvc{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:2px dashed var(--ac);border-radius:14px;font-size:18px;cursor:pointer}
#viewer{position:relative}
.pg{position:relative}
.top,.tools{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--sf);border-bottom:1px solid var(--ln);flex:none}
.tools{justify-content:center}
.pill{display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:4px;overflow-x:auto;max-width:100%}
.pill button,.top>button{min-width:44px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;line-height:1.1;flex:none;border-color:transparent;background:none}
.top>button{border-color:var(--ln);background:var(--sf)}

.hero{display:flex;align-items:center;gap:14px;margin:4px 0 18px}.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0e7490,#22d3ee);display:grid;place-items:center;font-size:32px;box-shadow:0 6px 16px rgba(14,116,144,.35)}

:root[data-theme=dark]{--bg:#0f172a;--sf:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--ac:#22d3ee;--ac2:#164e63;--ln:#334155;--desk:#0b1220;--dn:#f87171;color-scheme:dark}

/* stickers */
.obj.stk{pointer-events:auto;background:var(--sk,#fde68a);color:#2b2200;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:2;touch-action:none;min-width:104px;display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease}
.obj.stk.lift{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px rgba(0,0,0,.4)}
.obj.stk .sh{display:flex;align-items:center;gap:2px;padding:1px 3px;background:rgba(0,0,0,.10);border-radius:6px 6px 0 0;touch-action:none;flex:none}
.obj.stk .sh .mv{flex:1;height:26px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;font-size:13px}

.obj.stk.mini{width:38px!important;min-width:38px;height:38px;display:flex;flex-direction:row;align-items:center;justify-content:center;cursor:grab}
.obj.stk.mini .sh,.obj.stk.mini .tb,.obj.stk.mini .rz{display:none}
.obj.stk.mini .mi{display:block}
#stkbar{position:fixed;z-index:22;width:min(94vw,330px);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}

#trp{position:fixed;z-index:21;width:min(94vw,420px);background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.38);display:flex;flex-direction:column;max-height:46vh;overflow:hidden}

/* ==== دفتري 2.3 — أنماط الطبقة الإضافية ==== */
/* =========================================================
   دفتري 2.3 — أنماط الطبقة الإضافية
   كل الأصناف تبدأ بـ d3- حتى ما تتعارض مع أي صنف موجود.
   تستخدم متغيرات الثيم الموجودة (--ac/--sf/--ln/--tx/--mu/--bg/--dn)
   فتشتغل في الوضع الفاتح والليلي بدون أي تعديل إضافي.
   ========================================================= */
#d3save{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;margin-inline-start:2px;border-radius:999px;background:var(--bg);border:1px solid var(--ln);color:var(--mu);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
#d3save.on{color:#0e7490;border-color:#94d8e8;background:#e8f8fc}
[data-theme=dark] #d3save.on{color:#67e8f9;border-color:#155e75;background:#083344}
#d3save .d3sp{width:9px;height:9px;border-radius:50%;background:#f59e0b;flex:none}
#d3save.on .d3sp{background:#10b981}
#d3save.err{color:var(--dn);border-color:var(--dn)}
#d3save.err .d3sp{background:var(--dn)}

/* شريط الإجراءات السريعة + ملخص الدراسة في الرئيسية */
#d3home{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.d3row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.d3qa{display:flex;gap:8px;flex-wrap:wrap}
.d3qb{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.d3qb:hover{border-color:var(--ac)}
.d3qb b{font-weight:700;color:var(--ac)}
.d3qb.pri{background:var(--ac);color:#fff;border-color:transparent}
.d3grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.d3tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:start;font:inherit;color:var(--tx);cursor:pointer}
.d3tile .t{font-size:12px;color:var(--mu);font-weight:600}
.d3tile .v{font-size:17px;font-weight:700}
.d3tile .s{font-size:12px;color:var(--mu)}
.d3tile.warn{border-color:#f59e0b}
.d3tile.hot{border-color:var(--dn)}
.d3tile.done{border-color:#10b981}
.d3bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);overflow:hidden}
.d3bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .25s}

/* رسائل الإدارة (رسالة اليوم + العروض) */

/* شاشة «دراستي» */
#d3study{position:fixed;inset:0;z-index:92;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#d3study .box{background:var(--bg);color:var(--tx);border-radius:18px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--ln)}
#d3study .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--sf);flex:none}
#d3study .hd b{flex:1;font-size:16px}
#d3study .hd button{border:0;background:none;color:var(--tx);font-size:18px;cursor:pointer;padding:4px 8px}
#d3study .tabs{display:flex;gap:6px;padding:10px 14px 0;flex:none;flex-wrap:wrap}
#d3study .tabs button{border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
#d3study .tabs button.on{background:var(--ac);color:#fff;border-color:transparent}
#d3study .bd{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.d3sub{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:11px 13px}
.d3sub .dot{width:12px;height:12px;border-radius:50%;flex:none}
.d3sub .nm{flex:1;min-width:0}
.d3sub .nm b{display:block;font-size:15px}
.d3sub .nm span{font-size:12px;color:var(--mu)}
.d3sub .cd{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--ln);white-space:nowrap}
.d3sub .cd.k0{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.d3sub .cd.k1{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.d3sub .cd.k2{background:#dcfce7;color:#166534;border-color:#86efac}
[data-theme=dark] .d3sub .cd.k0{background:#3b0d0d;color:#fca5a5}
[data-theme=dark] .d3sub .cd.k1{background:#3a2a06;color:#fcd34d}
[data-theme=dark] .d3sub .cd.k2{background:#0b2f1a;color:#86efac}
.d3sub .ed{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px;padding:4px 6px}
.d3task{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 12px;cursor:pointer}
.d3task .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--ln);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--bg)}
.d3task.ok .ck{background:var(--ac);border-color:var(--ac)}
.d3task.ok{opacity:.62}
.d3task .tt{flex:1;min-width:0;font-size:14px}
.d3task .tt b{display:block;font-weight:600}
.d3task .tt span{font-size:12px;color:var(--mu)}
.d3f{display:flex;flex-direction:column;gap:5px}
.d3f label{font-size:13px;font-weight:600;color:var(--mu)}
.d3f input,.d3f select{font:inherit;padding:11px;border:1px solid var(--ln);border-radius:11px;background:var(--sf);color:var(--tx);-webkit-user-select:text;user-select:text;direction:auto;width:100%}
.d3f input[type=date],.d3f input[type=time]{direction:ltr;text-align:start;min-height:46px;font-size:16px}
.d3hint{font-size:12px;color:var(--mu);margin:0}
.d3quick{display:flex;gap:6px;flex-wrap:wrap}
.d3quick button{border:1px dashed var(--ln);background:none;color:var(--mu);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.d3quick button:hover{border-color:var(--ac);color:var(--ac)}
.d3colors{display:flex;gap:6px;flex-wrap:wrap}
.d3colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.d3colors button.on{border-color:var(--tx)}
.d3empty{text-align:center;color:var(--mu);padding:18px 10px;font-size:14px;line-height:1.8}
.d3chart{display:flex;gap:3px;align-items:flex-end;height:88px;padding:8px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.d3chart .b{flex:1;min-width:6px;background:var(--ac);border-radius:3px 3px 0 0;position:relative}
.d3chart .b.today{background:var(--ac2,#22d3ee)}
.d3sec{border:1px solid var(--ln);border-radius:14px;background:var(--sf);padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.d3sec>h4{margin:0;font-size:14px}
.d3sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.d3sw button{border:1px solid var(--ln);background:var(--bg);color:var(--mu);border-radius:999px;padding:6px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.d3sw button.on{background:var(--ac);color:#fff;border-color:transparent}

/* زر عائم لشاشة دراستي داخل الملف */
#d3float{position:fixed;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;flex-direction:column;gap:6px}
#d3float button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:17px;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#d3float button.n::after{content:'';position:absolute;transform:translate(14px,-14px);width:9px;height:9px;border-radius:50%;background:var(--dn)}

/* زر بطاقة من المحدد */
#d3selbtn{position:fixed;z-index:95;border:0;background:var(--ac);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}

/* تجميع الأدوات + طيها */
#d3toolbtn.on{background:var(--ac2);border-color:var(--ac)}
.d3grp{position:relative}
.d3grp.hid{display:none}
.d3hid{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);border-radius:12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;z-index:2}
body.d3-editing .d3grp{outline:2px dashed var(--ac);outline-offset:3px}
body.d3-editing .d3hid{display:grid}

/* overlay الاستيراد */
#d3imp{position:fixed;inset:0;z-index:94;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#d3imp .box{background:var(--bg);color:var(--tx);border-radius:16px;padding:20px;width:min(330px,92%);text-align:center;border:1px solid var(--ln)}
#d3imp .sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--ac);margin:0 auto 12px;animation:d3spin 1s linear infinite}
@keyframes d3spin{to{transform:rotate(360deg)}}
#d3imp .nm{font-weight:700;margin:0 0 6px;word-break:break-all}
#d3imp .st{font-size:13px;color:var(--mu);min-height:20px}
#d3imp .tm{font-size:12px;color:var(--mu);margin-top:8px}
#d3drop{position:fixed;inset:0;z-index:93;background:rgba(14,116,144,.16);border:3px dashed var(--ac);display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:18px;font-weight:700;color:var(--ac)}

/* توسيع الخط داخل التطبيق (يُطبَّق على مواضع النص فقط) */
body.d3-fs1{--d3fs:1.08}
body.d3-fs2{--d3fs:1.18}
body.d3-fs3{--d3fs:1.3}
body.d3-fs1 #panel textarea,body.d3-fs1 #panel input,body.d3-fs2 #panel textarea,body.d3-fs2 #panel input,body.d3-fs3 #panel textarea,body.d3-fs3 #panel input{font-size:calc(15px * var(--d3fs,1))}
body.d3-fs1 .tab p,body.d3-fs1 .cd,body.d3-fs2 .tab p,body.d3-fs2 .cd,body.d3-fs3 .tab p,body.d3-fs3 .cd{font-size:calc(15px * var(--d3fs,1))}
body.d3-hc{--ln:#64748b;--mu:#334155}
[data-theme=dark] body.d3-hc{--ln:#94a3b8;--mu:#cbd5e1}
body.d3-big .d3qb,body.d3-big .d3tile{padding:13px 16px}
body.d3-big .pill button,body.d3-big .top>button{min-width:50px;height:52px}

@media (max-width:520px){
  .d3grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
  #d3study .bd{padding:12px}
}
@media (prefers-reduced-motion:reduce){
  #d3imp .sp{animation-duration:2.4s}
  .d3bar>i{transition:none}
}

/* ---------- storage ---------- */
const openDB=()=>new Promise(r=>{try{const q=indexedDB.open('daftari',1);q.onupgradeneeded=()=>{q.result.createObjectStore('notes',{keyPath:'id'});q.result.createObjectStore('files')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const io=(st,mode,fn)=>new Promise(res=>{try{const t=db.transaction(st,mode),rq=fn(t.objectStore(st));t.oncomplete=()=>res(rq?rq.result:null);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}});
const putNote=x=>db?io('notes','readwrite',s=>s.put(x)):(mem.notes[x.id]=x);
const allNotes=async()=>db?((await io('notes','readonly',s=>s.getAll()))||[]):Object.values(mem.notes);
const delNote=async id=>{if(db){await io('notes','readwrite',s=>s.delete(id));await io('files','readwrite',s=>s.delete(id))}else{delete mem.notes[id];delete mem.files[id]}};
const putFile=(k,v)=>db?io('files','readwrite',s=>s.put(v,k)):(mem.files[k]=v);
const getFile=k=>db?io('files','readonly',s=>s.get(k)):mem.files[k];
function toast(m,ms=1500){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),ms)}
function touch(){n.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>putNote(n),400)}

const TERMS_V=1;
const TERMS_TXT=`شروط الاستخدام وسياسة الخصوصية — تطبيق «دفتري»

1) الاستخدام
دفتري تطبيق لتنظيم الملاحظات والمستندات والدراسة. باستخدامك له فأنت توافق على هذه الشروط. التطبيق مخصّص لمن عمره 13 سنة فأكثر.

2) البيانات التي نجمعها
• عند إنشاء حساب: الاسم، البريد الإلكتروني، سنة الميلاد، الجنس (اختياري)، وكلمة المرور (تُحفظ مشفّرة ولا يمكن لأي شخص قراءتها).
• بيانات تقنية: معرّف عشوائي للجهاز، رقم نسخة التطبيق، تاريخ آخر استخدام.
• رسائل الدعم التي ترسلها بنفسك.
• عند الدخول كضيف لا نجمع اسمك ولا بريدك، لكن يُسجَّل المعرّف التقني للجهاز.

3) ملفاتك وملاحظاتك
تُحفظ على جهازك فقط ولا تُرفع إلى سيرفراتنا.

4) ميزات الذكاء الاصطناعي
عند استخدامك لها يُرسل المحتوى الذي تختاره إلى مزوّد الخدمة (مزوّد الذكاء الاصطناعي المعتمد داخل دفتري) لمعالجته، وتخضع هذه البيانات لسياسات المزوّد.

5) كيف نستخدم بياناتك
لتشغيل الحساب والدعم الفني وتحسين التطبيق وإرسال إشعارات التحديث. لا نبيع بياناتك لأي طرف.

6) حقوقك
يمكنك طلب حذف حسابك وبياناتك في أي وقت عبر الدعم داخل التطبيق.

7) إيقاف الحساب
يحق لنا إيقاف أي حساب أو جهاز يسيء استخدام التطبيق.

8) التعديلات
قد نحدّث هذه الشروط، وسنُعلمك داخل التطبيق عند حدوث تغيير جوهري.`;

/* ---------- لوح الشرح ---------- */
/* دفتري AI 2.4 — وسوم الرسم على اللوح:
   #title: نص    n|عنوان|شرح    #box: نص    #formula: معادلة    #arrow
   أي نص بلا وسوم → null (تراجع آمن، يُرسم كنص عادي) */
function parseBoard(t){
  const s=String(t||'');
  if(!s.trim())return null;
  const out=[];
  s.split(/\r?\n/).forEach(L=>{
    const raw=L.trim();if(!raw)return;
    let m=raw.match(/^#\s*title\s*[|:]\s*(.+)$/i);
    if(m){out.push({k:'title',text:m[1]});return}
    m=raw.match(/^#\s*box\s*[|:]\s*(.+)$/i);
    if(m){out.push({k:'box',text:m[1]});return}
    m=raw.match(/^#\s*formula\s*[|:]\s*(.+)$/i);
    if(m){out.push({k:'formula',text:m[1]});return}
    m=raw.match(/^#\s*(?:arrow|note)\s*[|:]?\s*(.*)$/i);
    if(m){out.push({k:'arrow',text:m[1]||''});return}
    m=raw.match(/^(\d+)\s*\|\s*([^|]*)(?:\|\s*([\s\S]*))?$/);
    if(m){out.push({k:'step',n:m[1],head:(m[2]||'').trim()||('خطوة '+m[1]),body:(m[3]||'').trim()});return}
    out.push({k:'text',text:raw})});
  return out.length?out:null}
function boardBlocks(items){
  /* تحويل العناصر إلى صفحات بمقاس اللوح (W × 700): نص + مستطيلات وأسهم */
  const pages=[];let p=null,y=0;
  const newP=()=>{p={h:700,strokes:[],bg:null,objs:[]};pages.push(p);y=64};
  const need=h=>{if(!p||y+h>650)newP()};
  const box=(y0,w,h,c)=>{p.strokes.push({t:'rc',pts:[[52,y0],[52+w,y0+h]],w:4,c:c||'#0e7490'})};
  items.forEach(it=>{
    const size=it.k==='title'?34:((it.k==='step'&&it.head)?25:21);
    const headTxt=(it.k==='step'?((it.n?it.n+'. ':'')+it.head):(it.k==='formula'?'∎ '+it.text:it.head||it.text));
    const lines=String(headTxt).split(/\r?\n/);
    const bodyLines=it.k==='step'&&it.body?String(it.body).split(/\r?\n/):[];
    const hgt=size*1.4*lines.length+(bodyLines.length?19*1.45*bodyLines.length:0)+20;
    need(hgt);
    if(it.k==='title'){
      p.objs.push({k:'t',x:60,y:y,w:W-120,s:size,c:'#13202b',b:1,text:headTxt});
      box(y-12,W-120,size*1.4*lines.length+22,'#0e7490');
      y+=hgt+24;return}
    if(it.k==='box'){
      const w=Math.min(600,W-120);box(y-8,w,size*1.4*lines.length+18,'#0e7490');
      p.objs.push({k:'t',x:70,y:y,w:w-32,s:size,c:'#0b3b46',text:headTxt});y+=hgt+18;return}
    if(it.k==='formula'){
      const w=Math.min(480,W-120);box(y-8,w,size*1.4*lines.length+16,'#7c3aed');
      p.objs.push({k:'t',x:70,y:y,w:w-32,s:size,c:'#3b0764',text:headTxt});y+=hgt+18;return}
    if(it.k==='arrow'){
      p.strokes.push({t:'ar',pts:[[80,y],[Math.min(W-80,460),y]],w:4,c:'#dc2626'});
      if(it.text){p.objs.push({k:'t',x:80,y:y+8,w:W-160,s:19,c:'#5d7482',text:it.text});y+=26}
      y+=hgt;return}
    p.objs.push({k:'t',x:60,y:y,w:W-120,s:size,c:(it.k==='step'?'#0e7490':'#1a1a1a'),b:(it.k==='step'?1:0),text:headTxt});
    y+=size*1.4*lines.length+4;
    if(bodyLines.length){p.objs.push({k:'t',x:84,y:y,w:W-168,s:19,c:'#1a1a1a',text:bodyLines.join('\n')});y+=19*1.45*bodyLines.length}
    y+=14});
  return pages}

}

async function andPoll(){
  try{
    if(!window.Android||typeof Android.getOpenUri!=='function')return;
    const u=Android.getOpenUri();if(!u)return;
    if(u===andLast)return;andLast=u;
    const info=JSON.parse(Android.fileInfo(u)||'{}');
    const name=info.name||'ملف.pdf',mime=String(info.mime||''),size=+info.size||0;
    if(!size)throw new Error('الملف فاضي أو غير قابل للقراءة');
    if(size>30*1024*1024)throw new Error('الملف كبير جداً (الحد 30MB)');
    toast('جارٍ فتح الملف…',20000);
    const CH=3*65536,parts=[];
    for(let off=0;off<size;off+=CH){const b=Android.readB64(u,off,Math.min(CH,size-off));if(!b)break;parts.push(b)}
    const bin=atob(parts.join('')),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const f=new File([arr],name,{type:mime||'application/octet-stream'});
    if(/^image\//i.test(mime)&&!/pdf/i.test(mime))await impImg(f);
    else await importFile(f);
  }catch(e){toast('تعذّر فتح الملف: '+((e&&e.message)||e),6000)}
}

  if(C.plan[dkey]&&!force)return C.plan[dkey];

    .sort(function(a,b){return daysTo(a.exam)-daysTo(b.exam)});
  if(!nx.length){
    var due=CARDS.due||0;
    items.push({id:'plan:cards:'+dkey,k:'cards',n:Math.min(20,Math.max(6,due||10)),t:'مراجعة بطاقات مستحقة'});
    if(due>=12)items.push({id:'plan:cards2:'+dkey,k:'cards',n:Math.min(20,due),t:'دفعة بطاقات ثانية'});
    items.push({id:'plan:read:'+dkey,k:'read',n:1,t:'جلسة قراءة وتلخيص (25 دقيقة)'});
  }else{
    var slots=2;
    var due=CARDS.due||0;
    if(due>25)slots=4;else if(due>12)slots=3;
    nx.slice(0,3).forEach(function(s,i){
      var d=daysTo(s.exam),nq=Math.min(20,Math.max(5,Math.ceil((CARDS.bySub[s.id]||0)/(d>3?2:1))));
      items.push({id:'plan:'+s.id+':c:'+dkey,k:'cards',s:s.id,n:nq,t:'بطاقات «'+s.name+'»'+(d<=2?' — امتحان بعد '+d+' يوم':'')});
      if(d<=3)items.push({id:'plan:'+s.id+':q:'+dkey,k:'quiz',s:s.id,n:1,t:'اختبار قصير: '+s.name});
      if(i<slots)items.push({id:'plan:'+s.id+':r:'+dkey,k:'read',s:s.id,n:1,t:'قراءة وتلخيص: '+s.name});
    });
  }
  items.forEach(function(x){x.done=0});
  C.plan[dkey]={items:items,created:Date.now()};
  persist('plan');
  return C.plan[dkey];
}

function patchHome(){
  if(typeof window.home!=='function')return false;
  var orig=window.home;
  window.home=function(){
    return Promise.resolve(orig.apply(this,arguments)).then(function(r){
      try{renderHome()}catch(e){console.warn('[daftari+] home',e)}
      return r;
    });
  };
  if(typeof window.fillStat==='function'){
    var fs=window.fillStat;
    window.fillStat=function(){
      return Promise.resolve(fs.apply(this,arguments)).then(function(){
        try{
          var ex=q1('#exb');
          if(ex)ex.onclick=function(){openStudy('subs')};          /* استبدال إدخال التاريخ كتابةً بشاشة اختيار */
          renderHome();
        }catch(e){}
      });
    };
  }
  return true;
}
function renderHome(){
  var H=q1('#home');if(!H||H.hidden)return;
  var old=q1('#d3home');if(old)old.remove();
  var actives=activeMsgs();
  var tip=null,promo=null;
  for(var i=0;i<actives.length;i++){
    var m=actives[i];
    if(!tip&&m.type!=='promo')tip=m;
    if(!promo&&m.type==='promo')promo=m;
    if(tip&&promo)break;
  }
  if(!C.ui.tipOn)tip=null;
  if(!C.ui.promoOn)promo=null;
  var nx=nextExam(),plan=todayPlan(),dn=planDoneCount(plan);
  var unread=unreadMsgs().length;
  var b=el('div');b.id='d3home';
  var msgHtml='';
  if(promo)msgHtml+=msgCard(promo,true);
  if(tip)msgHtml+=msgCard(tip,false);
  b.innerHTML=
    '<div class="d3row" id="d3qa">'+
      qaBtn('🎯','دراستي','study')+
      qaBtn('🃏','مراجعة اليوم'+(CARDS.due?' <b>'+CARDS.due+'</b>':''),'review')+
      qaBtn('📬','الرسائل'+(unread?' <b>'+unread+'</b>':''),'inbox')+
      qaBtn('⏱','جلسة 25 دق','timer')+
      qaBtn('↕','ترتيب','sort')+
      qaBtn('⚙','ضبط','settings')+
    '</div>'+
    (msgHtml?'<div id="d3msgs">'+msgHtml+'</div>':'')+
    '<div class="d3grid">'+
      tile(nx?('📝 '+(nx.s.name||'امتحان')):'📝 لا امتحانات',
            nx?(nx.d===0?'اليوم!':(nx.d>0?'باقي '+nx.d+' يوم':'انتهى')):'أضف موعد امتحان',
            nx?(fmtDate(nx.s.exam)):'نظام اختيار بالتقويم',nx?'warn':'',
            'study')+
      tile('🃏 بطاقات مستحقة',String(CARDS.due||0),CARDS.due?('ابدأ المراجعة الآن'):'لا شيء اليوم — أحسنت 🎉','review')+
      tile('✅ خطة اليوم',dn+' / '+plan.items.length,barHtml(dn,Math.max(1,plan.items.length)),'','plan')+
      tile('⏱ وقت اليوم','—','اضغط لعرض تقدمك','','prog')+
    '</div>';
  var acts=q1('#home .acts');
  if(acts&&acts.parentNode)acts.parentNode.insertBefore(b,acts.nextSibling);else H.append(b);
  studyStats().then(function(s){
    var t=q1('#d3home .d3grid');if(!t)return;
    var cell=t.children[3];
    if(cell){
      cell.querySelector('.v').textContent=s.mins+' / '+(s.goal||30)+' دقيقة';
      cell.querySelector('.s').innerHTML=barHtml(s.mins,s.goal||30);
      cell.className='d3tile'+(s.mins>=(s.goal||30)?' done':(s.mins>0?'':''));
      var st=t.children[0];
      if(st&&s.ex&&!C.subs.length)st.querySelector('.s').textContent='⏳ '+(s.ex.name||'')+': باقي '+Math.max(0,daysTo(s.ex.date||s.ex))+' يوم';
    }
  }).catch(function(){});
  bindHomeStrip();
}
function qaBtn(ic,lb,act){return '<button class="d3qb" data-d3act="'+act+'">'+ic+' '+lb+'</button>'}
function tile(t,v,s,cls,act){return '<button class="d3tile '+(cls||'')+'" data-d3act="'+(act||'')+'"><span class="t">'+E(t)+'</span><span class="v">'+E(v)+'</span><span class="s">'+s+'</span></button>'}
function barHtml(a,b){var p=Math.max(0,Math.min(100,Math.round(a/Math.max(1,b)*100)));return '<div class="d3bar"><i style="width:'+p+'%"></i></div>'}
function msgCard(m,isPromo){
  return '<div class="d3msg'+(isPromo?' promo':'')+'" data-d3msg="'+E(m.id)+'">'+
    '<div class="ic">'+(isPromo?'🎁':'📣')+'</div>'+
    '<div class="bd"><b>'+E(m.title||'رسالة')+'</b><p>'+E(m.text||'')+'</p>'+
    (m.url||m.action?'<button class="d3msgbtn" data-d3go="'+E(m.id)+'">'+(m.target?'افتح':'تفاصيل')+'</button>':'')+
    '</div><button class="x" data-d3x="'+E(m.id)+'" title="إخفاء">✕</button></div>';
}
function bindHomeStrip(){
  var H=q1('#d3home');if(!H)return;
  H.addEventListener('click',function(e){
    var go=e.target.closest('[data-d3go]'),x=e.target.closest('[data-d3x]'),a=e.target.closest('[data-d3act]');
    try{
      if(x){e.preventDefault();dismiss(x.dataset.d3x);renderHome();return}
      if(go){e.preventDefault();var m=C.inbox[go.dataset.d3go];markSeen(go.dataset.d3go);runMsg(m);renderHome();return}
      if(a){
        var k=a.dataset.d3act;
        if(k==='study')openStudy('subs');
        else if(k==='inbox')openInbox();
        else if(k==='review')reviewAll();
        else if(k==='plan')openStudy('plan');
        else if(k==='prog')openStudy('prog');
        else if(k==='sort')sortMenu();
        else if(k==='settings')settingsMenu();
        else if(k==='timer'){var t=q1('#tmr');if(t)t.click();else say('افتح دفترًا أولًا ثم جرّب المؤقت')}
      }
    }catch(err){console.warn('[daftari+] strip',err);say('ما صار شي، جرّب مرة ثانية')}
  });
}
async function runMsg(m){
  if(!m)return;
  var act=String(m.action||''),url=String(m.url||'');
  if(url){try{open(url,'_blank','noopener');return}catch(e){}}
  if(act==='study')return openStudy('subs');
  if(act==='plan')return openStudy('plan');
  if(act==='cards')return reviewAll();
  if(act==='ai'&&window.__daftariAI)return window.__daftariAI.open();
  if(act==='support'){var b=q1('#supb');if(b)return b.click()}
  if(act.indexOf('note:')===0&&typeof window.openNote==='function'){var id=act.slice(5);return callFn('openNote',id)}
  say('رسالة بدون رابط');
}

/* ---------- ترتيب الملفات + ملونة الدفاتر ---------- */
function sortMenu(){
  var L=[['🆕 الأحدث أولاً','recent'],['📅 الأقدم أولاً','old'],['أ↩ ي حسب الاسم','az'],['ي↩ أ حسب الاسم','za'],['✋ الترتيب اليدوي (اسحب)','manual']];
  try{menu('ترتيب الملفات',L.map(function(o){return [(C.ui.sort===o[1]?'✓ ':'')+o[0],function(){setSort(o[1])}]}))}catch(e){
    var pick=prompt(L.map(function(o,i){return (i+1)+'. '+o[0]}).join('\n'));if(pick===null)return;
    var k=L[(parseInt(pick,10)||1)-1];if(k)setSort(k[1]);
  }
}
async function setSort(mode){
  C.ui.sort=mode;persistUI();
  if(mode==='manual'){say('اسحب الملفات بال⋮⋮ لترتيبها يدويًا');return renderHome()}
  var L=noteList().slice();
  L.sort(function(a,b){
    if(mode==='old')return a.updated-b.updated;
    if(mode==='az')return String(a.title||'').localeCompare(String(b.title||''),'ar');
    if(mode==='za')return String(b.title||'').localeCompare(String(a.title||''),'ar');
    return b.updated-a.updated;
  });
  try{
    var META=await getMeta();
    L.forEach(function(x,i){(META[x.id]=META[x.id]||{}).o=i*10});
    await putFile('_gmeta',JSON.stringify(META));
    if(typeof window.home==='function')await window.home();
    else if(typeof window.renderList==='function')window.renderList();
  }catch(e){}
  renderHome();
}
async function getMeta(){try{return JSON.parse((await getFile('_gmeta'))||'{}')||{}}catch(e){return {}}}

/* ---------- شاشة «دراستي» ---------- */
var studyTab='subs';
function openStudy(tab){
  studyTab=tab||studyTab||'subs';
  var old=q1('#d3study');if(old)old.remove();
  var d=el('div');d.id='d3study';
  d.innerHTML='<div class="box"><div class="hd"><b>🎯 نظام الدراسة</b><button id="d3x" title="إغلاق">✕</button></div>'+
    '<div class="tabs">'+
      tBtn('subs','📅 امتحاناتي')+tBtn('plan','✅ خطة اليوم')+tBtn('prog','📈 تقدمي')+tBtn('rem','🔔 تذكير وضبط')+
    '</div><div class="bd" id="d3bd"></div></div>';
  document.body.append(d);
  d.addEventListener('click',function(e){
    var t=e.target.closest('[data-d3tab]');
    if(t){studyTab=t.dataset.d3tab;qa('#d3study [data-d3tab]').forEach(function(b){b.className=b===t?'on':''});return drawStudy()}
    if(e.target.id==='d3x'||e.target.closest('#d3x')){d.remove();return}
  });
  d.addEventListener('click',function(e){if(e.target===d)d.remove()});
  document.addEventListener('keydown',escClose);

function escClose(e){if(e.key==='Escape'){var s=q1('#d3study');if(s){s.remove();document.removeEventListener('keydown',escClose)}}}
function tBtn(k,l){return '<button data-d3tab="'+k+'"'+(studyTab===k?' class="on"':'')+'>'+l+'</button>'}
async function drawStudy(){
  var B=q1('#d3study #d3bd');if(!B)return;
  qa('#d3study [data-d3tab]').forEach(function(b){b.className=b.dataset.d3tab===studyTab?'on':''});
  if(studyTab==='subs')return drawSubs(B);
  if(studyTab==='plan')return drawPlan(B);
  if(studyTab==='prog')return drawProg(B);
  return drawRem(B);
}

    '<div class="d3row" style="margin-top:6px"><button class="d3qb pri" id="f_sv">💾 حفظ</button>'+
      (isNew?'':'<button class="d3qb" id="f_rm">🗑 حذف</button>')+'<button class="d3qb" id="f_cn">إلغاء</button></div>';

  qa('#d3study [data-q]').forEach(function(b){b.onclick=function(){

    q1('#f_dt').value=day(d);
  }});
  q1('#f_cn').onclick=function(){drawSubs()};
  q1('#f_sv').onclick=function(){

function rebuildPlan(){try{delete C.plan[today()];persist('plan')}catch(e){}}
function drawPlan(B){
  B=B||q1('#d3study #d3bd');if(!B)return;
  var p=todayPlan(),dn=planDoneCount(p);
  B.innerHTML='<div class="d3row"><div class="d3tile" style="cursor:default"><span class="t">خلّصت اليوم</span><span class="v">'+dn+' من '+p.items.length+'</span>'+barHtml(dn,Math.max(1,p.items.length))+'</div>'+
    '<button class="d3qb" id="p_re">↻ خطة جديدة</button></div>'+
    (p.items.length?'':'<div class="d3empty">ما في مهام اليوم — أضف مادة أو ابدأ مراجعة.</div>')+
    p.items.map(function(t,i){
      return '<div class="d3task'+(t.done?' ok':'')+'" data-pi="'+i+'"><span class="ck">'+(t.done?'✓':'')+'</span>'+
        '<span class="tt"><b>'+E(t.t||'')+'</b><span>'+taskSub(t)+(t.n?(' — '+t.n+' بطاقة'):'')+' · اضغط للبدء</span></span></div>';
    }).join('');
  q1('#p_re').onclick=function(){rebuildPlan();drawPlan(q1('#d3study #d3bd'));say('تولّفت خطة جديدة');};
  qa('#d3study [data-pi]').forEach(function(row){row.onclick=async function(){
    var i=+row.dataset.pi,t=p.items[i];
    if(!t.done){t.done=1;persist('plan');row.className='d3task ok';row.querySelector('.ck').textContent='✓';

      if(left===0){say('أنهيت خطة اليوم 🎉 أحسنت!');addLog({k:'plan',n:p.items.length})}
    }else{t.done=0;persist('plan');row.className='d3task';row.querySelector('.ck').textContent=''}
    if(homeShown())renderHome();
    await doTask(t);
  }});

function taskSub(t){var s=t.s?subOf(t.s):null;return s?('لمادة '+s.name):'عام'}
async function doTask(t){
  try{
    if(t.k==='cards'){
      var s=t.s?subOf(t.s):null,nb=notebookFor(s);
      if(!nb){reviewAll();return}
      await callFn('openNote',nb.id);
      callFn('openPanel','c');
      setTimeout(function(){var r=q1('#rev');if(r)r.click()},250)
      return;
    }
    if(t.k==='quiz'){
      var s2=t.s?subOf(t.s):null,nb2=notebookFor(s2)||((noteList()[0])||null);
      if(!nb2)return say('افتح دفتر فيه نص لتوليد اختبار');
      await callFn('openNote',nb2.id);callFn('openPanel','q');
      say('اختيار الأسئلة من ملفك — لو ما ظهر شي تحتاج ذكاء اصطناعي مفعّل');
      var z=q1('#qz');if(z)setTimeout(function(){try{z.click()}catch(e){}},300);
      return;
    }
    if(t.k==='read'){
      var s3=t.s?subOf(t.s):null,nb3=notebookFor(s3)||((noteList()[0])||null);
      if(!nb3)return say('ما في دفتر بعد — ارفع ملف أو أنشئ دفتر');
      await callFn('openNote',nb3.id);callFn('openPanel','t');
      say('اقرأ وعلّم اللي تحتاجه، وحوّل أي نص محدد لبطاقة');
    }
  }catch(e){console.warn('[daftari+] task',e);say('تعذّر فتح المهمة')}
}

/* ---------- المراجعة الشاملة لكل البطاقات المستحقة ---------- */
var RV={q:[],i:0,flip:false};
async function reviewAll(){
  var t=Date.now(),pool=[];
  var L=(CARDS.all&&CARDS.all.length)?CARDS.all:await allNotesSafe();
  (L||[]).forEach(function(x){(x.cards||[]).forEach(function(c,i){if((c.due||0)<=t)pool.push({n:x,c:c,ci:i})})});
  if(!pool.length){say('ما في بطاقات مستحقة الآن 🎉 ارجع لاحقًا');return}
  pool.sort(function(){return Math.random()-.5});
  RV.q=pool.slice(0,Math.min(30,pool.length));RV.i=0;RV.flip=false;
  var d=el('div');d.id='d3study';
  d.innerHTML='<div class="box"><div class="hd"><b>🃏 مراجعة اليوم ('+RV.q.length+')</b><button id="d3x">✕</button></div><div class="bd" id="d3bd"></div></div>';
  document.body.append(d);
  d.addEventListener('click',function(e){if(e.target===d||e.target.closest('#d3x'))d.remove()});
  drawRV();

var lastTotal=0,subTimer=0,liveTm=0;
async function trackSubjectTime(){
  try{
    if(typeof stats!=='function')return;
    var j=await stats();if(!j||!j.d)return;
    var tot=j.d[today()]||0;
    var delta=Math.max(0,tot-lastTotal);lastTotal=tot;
    if(delta<=0)return;
    var nn=curNote();if(!nn)return;
    var sid=nn.d3sub||subjectForNote(nn.id);
    if(!sid)return;
    var s=subOf(sid);if(!s)return;
    s.mins=Math.round(((s.mins||0)+delta)/60);
    s.nbMins=Math.round(((s.nbMins||0)+delta)/60);
    persist('subs');
  }catch(e){}
}
function subjectForNote(id){
  for(var i=0;i<C.subs.length;i++)if(C.subs[i].note===id)return C.subs[i].id;
  return '';
}

var SELT=['#mytext','#aout','#srctext','#tro','#cq','#ca'];
function installSelCard(){
  var btn=null,hiding=0;
  function hide(){if(btn){btn.remove();btn=null}}
  function selInfo(){
    var a=document.activeElement;
    if(!a||a.tagName!=='TEXTAREA')return null;
    if(SELT.indexOf('#'+(a.id||''))<0)return null;
    var s=a.selectionStart,e=a.selectionEnd;
    if(s==null||e==null||s===e)return null;
    var t=String(a.value.slice(s,e)).replace(/\s+/g,' ').trim();
    if(t.length<4)return null;
    return {el:a,text:t.slice(0,900)};
  }
  function show(){
    var info=selInfo();
    if(!info){if(!hiding)hide();return}
    if(!btn){
      btn=el('button','🃏 حوّل المحدد لبطاقة');btn.id='d3selbtn';
      btn.onclick=function(){makeCardFrom(btn._info)};
      document.body.append(btn);
    }
    btn._info=info;
    var r=info.el.getBoundingClientRect();
    btn.style.left=Math.max(8,Math.min(innerWidth-150,r.left+12))+'px';
    btn.style.top=Math.max(8,r.top-40)+'px';
  }
  document.addEventListener('selectionchange',function(){try{show()}catch(e){}});
  document.addEventListener('mouseup',function(){setTimeout(function(){try{show()}catch(e){}},40)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  document.addEventListener('pointerdown',function(e){if(e.target&&e.target.id!=='d3selbtn')setTimeout(function(){try{show()}catch(x){}},60)},true);
}

function restorePen(){
  var p=C.pen;
  if(!p||!p.t)return;
  var S=penS();
  try{
    if(S&&p.S)for(var k in p.S)if(S[k]){if(p.S[k].w!=null)S[k].w=p.S[k].w;if(p.S[k].c)S[k].c=p.S[k].c}
    if(p.t&&typeof window.setTool==='function'&&p.t!=='trn')window.setTool(p.t);
  }catch(e){}
}
function installPenSave(){
  var busy=0;
  var save=function(){
    if(busy)return;busy=1;setTimeout(function(){busy=0},300);
    try{
      var S=penS(),snap={};
      if(S)for(var k in S)if(S[k]&&typeof S[k]==='object')snap[k]={w:S[k].w,c:S[k].c};
      var cur=(typeof tool!=='undefined')?tool:'';
      C.pen={t:cur,S:snap};persist('pen');
    }catch(e){console.warn('[daftari+] pen',e)}
  };
  /* أدق طريقة: نلفّف دالة تبديل الأداة نفسها */
  if(typeof window.setTool==='function'){
    var orig=window.setTool;
    window.setTool=function(t){
      var r=orig.apply(this,arguments);
      try{C.pen.t=(typeof t==='string')?t:((typeof tool!=='undefined')?tool:C.pen.t);persist('pen')}catch(e){}
      return r;
    };
  }
  var pop=q1('#pop');
  if(pop){
    pop.addEventListener('input',save,true);
    pop.addEventListener('click',save,true);
    pop.addEventListener('change',save,true);
  }
  document.addEventListener('click',function(e){
    try{if(e.target&&e.target.closest&&e.target.closest('[data-tool]'))setTimeout(save,150)}catch(x){}
  },true);
  document.addEventListener('click',function(e){
    try{if(e.target&&(e.target.id==='pcu'||e.target.id==='pr'||e.target.closest&&e.target.closest('.rg,.sw')))setTimeout(save,150)}catch(x){}
  },true);
  return typeof window.setTool==='function';
}

/* ---------- 9) تنظيم شريط الأدوات (طي/إظهار + الكل) ---------- */
function installToolbar(){
  var pill=q1('#viewer .tools .pill');if(!pill||q1('#d3toolbtn'))return false;
  var wrap=el('span','grp');wrap.id='d3toolsgrp';
  wrap.innerHTML='<button id="d3toolbtn" title="تنظيم الأدوات"><i>⚙️</i><small>تنظيم</small></button>'+
                 '<button id="d3allbtn" title="كل الأدوات"><i>⧉</i><small>كل الأدوات</small></button>';
  pill.append(wrap);
  var st=q1('#viewer .top .pill');
  if(st&&!q1('#d3studybtn')){
    var sb=el('button','','<i>🎯</i><small>دراستي</small>');sb.id='d3studybtn';
    sb.onclick=function(){openStudy('plan')};st.append(sb);
  }
  var groups=function(){return qa('#viewer .tools .pill .grp').filter(function(g){return g.id!=='d3toolsgrp'})};
  var key=function(g){return qa('button',g).map(function(b){return b.dataset.tool||b.id}).join('|')};
  function apply(){groups().forEach(function(g){var k=key(g);g.className='grp d3grp'+(C.hide[k]?' hid':'')})}
  groups().forEach(function(g){
    if(!q1('.d3hid',g)){
      var h=el('div','d3hid','إخفاء');h.title='اضغط لإخفاء هذه المجموعة';
      h.onclick=function(ev){ev.preventDefault();ev.stopPropagation();var k=key(g);C.hide[k]=C.hide[k]?0:1;persist('hide');apply();say(C.hide[k]?'خبّينا المجموعة — ترجعها من «كل الأدوات»':'ظهرت المجموعة')};
      g.style.position='relative';g.classList.add('d3grp');g.append(h);
    }
  });
  apply();
  q1('#d3toolbtn').onclick=function(){
    var on=document.body.classList.toggle('d3-editing');
    q1('#d3toolbtn').className=on?'on':'';
    say(on?'وضع التنظيم: اضغط «إخفاء» على أي مجموعة':'انتهى وضع التنظيم');
  };
  q1('#d3allbtn').onclick=function(){
    var L=qa('#viewer .tools button[data-tool],#viewer .tools button[id]')
      .filter(function(b){return !/d3/.test(b.id||'')})
      .map(function(b){
        var nm=(b.querySelector&&b.querySelector('small'))?b.querySelector('small').textContent:(b.id||'');
        return [nm,function(){try{b.click()}catch(e){}}];
      });
    try{menu('كل الأدوات',L)}catch(e){say('الأدوات موجودة بشريط الأدوات فوق')}
  };
  return true;
}

/* ---------- 10) اختصارات لوحة المفاتيح ---------- */
function installShortcuts(){
  addEventListener('keydown',function(e){
    try{
      var t=e.target||{};
      var typing=/input|textarea|select/i.test(t.tagName||'')||(t.isContentEditable);
      if((e.ctrlKey||e.metaKey)&&!e.altKey){
        var k=(e.key||'').toLowerCase();
        if(k==='z'&&!typing){e.preventDefault();e.shiftKey?callFn('redoDo'):callFn('undoDo');return}
        if(k==='y'&&!typing){e.preventDefault();callFn('redoDo');return}
        if(k==='s'){e.preventDefault();var b=q1('#shr')||q1('#shr2');if(b)b.click();return}
        if(k==='f'){e.preventDefault();var s=q1('#srch');if(s)s.click();return}
        if(k==='p'){e.preventDefault();var a=q1('#addpg');if(a)a.click();return}
      }
      if(!typing&&(e.key==='Escape')&&q1('#d3study')){var d=q1('#d3study');d.remove()}
    }catch(err){}
  });
}

/* ---------- 10b) إبقاء عدّاد «مراجعة اليوم» لحظي ---------- */
function patchCardsLive(){
  if(typeof window.cards!=='function')return false;
  var orig=window.cards;
  window.cards=function(){
    var r=orig.apply(this,arguments);
    clearTimeout(liveTm);
    liveTm=setTimeout(function(){refreshCards().then(function(){if(homeShown())renderHome()}).catch(function(){})},600);
    return r;
  };
  return true;
}

/* ---------- 11) رسائل السيرفر عبر ping (لو Worker محدّث) ---------- */
function patchPing(){
  if(typeof window.applyCfg!=='function')return false;
  var orig=window.applyCfg;
  window.applyCfg=function(j){
    try{
      if(j&&(j.msgs||j.dm)){
        var arr=Array.isArray(j.msgs)?j.msgs.slice():[];
        if(j.dm)arr.unshift(Object.assign({id:'ping-'+day(),type:'study',title:'📣 من الإدارة'},j.dm));
        arr.forEach(function(m){
          if(!m||!m.text)return;
          var id=String(m.id||('p-'+(m.title||'')+(m.text||'').length));
          if(C.inbox[id])return;
          C.inbox[id]={id:id,type:m.type||'study',title:m.title||'رسالة من الإدارة',text:String(m.text).slice(0,1200),
            url:m.url||'',action:m.action||'',target:m.target||'',ts:m.ts||Date.now(),from:m.from||'',to:m.to||'',pin:!!m.pin};
        });
        persist('inbox');
        if(homeShown())setTimeout(renderHome,300);
      }
    }catch(e){}
    return orig.apply(this,arguments);
  };
  return true;
}


/* =========================================================
   12) التشغيل
   ========================================================= */
async function boot(){
  var done={};
  try{
    await loadAll();
    done.save=installSave();
    done.import=installImport();installDrop();
    done.home=patchHome();
    done.quiz=patchQuiz();
    done.cardsLive=patchCardsLive();
    done.ping=patchPing();
    done.color=patchCardColor();
    done.pen=installPenSave();
    done.tools=installToolbar();
    installShortcuts();installSelCard();
    applyA11y();restorePen();migrateExam();
    await refreshCards();
    try{await pullMessages()}catch(e){console.warn('[daftari+] msgs',e)}
    /* أول رسم للشريط الدراسي (لو الرئيسية كانت مفتوحة قبل ربط الطبقة) */
    try{if(typeof window.home==='function')await window.home()}catch(e){renderHome()}
    try{
      if(typeof stats==='function'){var j=await stats();lastTotal=((j&&j.d)||{})[today()]||0}
    }catch(e){}
    /* عدّاد الوقت لكل مادة + تحديث الرسائل + التذكير */
    setInterval(function(){try{trackSubjectTime()}catch(e){}},30000);
    setInterval(function(){try{refreshCards();if(homeShown())renderHome()}catch(e){}},60000);
    setInterval(function(){pullMessages().then(function(){if(homeShown())renderHome()}).catch(function(){})},900000);
    setInterval(function(){try{showReminder(false)}catch(e){}},300000);
    setTimeout(function(){try{showReminder(false)}catch(e){}},12000);
    D3.features=done;D3.ok=1;
    console.log('[daftari+] 2.4.1 مفعّلة',done);
  }catch(e){
    console.warn('[daftari+] تعذّر تشغيل الطبقة الإضافية — التطبيق الأساسي يشتغل مثل أول',e);
    D3.error=String(e&&e.message||e);
  }
}
window.__d3={
  v:'2.3',D3:D3,open:openStudy,inbox:openInbox,review:reviewAll,remind:showReminder,
  msgs:activeMsgs,tips:TIPS,subs:function(){return C.subs},ui:function(){return C.ui},
  plan:todayPlan,reload:function(){location.reload()}
};
/* خطافات للفحص الذاتي (تُستخدم في الاختبار الآلي والتشخيص، ما تأثر على الاستخدام العادي) */
window.__d3._setQuiz=function(q,w,i){try{QZ={q:q,i:i||0,s:0,w:w};callFn('qzShow');return true}catch(e){return false}};
window.__d3.state=function(){return {pen:C.pen,subs:C.subs,ui:C.ui,inbox:Object.keys(C.inbox).length,plan:(C.plan[today()]||null),log:C.log.length,cards:CARDS.due}};
if(document.readyState==='loading')addEventListener('DOMContentLoaded',boot);else boot();
})();
