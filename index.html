<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#fff;--sf:#fff;--tx:#13202b;--mu:#5b6a77;--ac:#0e7490;--ac2:#e0f2f7;--ln:#d6dce2;--desk:#c7ced6;--dn:#b91c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Readex Pro",Tahoma,system-ui,sans-serif;font-size:15px;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer;touch-action:manipulation}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.screen{height:100%}
#home{overflow:auto;padding:20px 16px 40px;max-width:820px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px}
.sub{color:var(--mu);margin:0 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.last{display:block;width:100%;text-align:start;background:var(--ac);color:#fff;border:0;border-radius:16px;padding:18px;margin:0 0 20px}
.last small{opacity:.85;display:block;margin-bottom:4px}
.last b{font-size:20px}
.list{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.card .go{flex:1;text-align:start;background:none;border:0;padding:0}
.card b{display:block;font-size:16px}
.card span{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.del{color:var(--dn);border-color:transparent;background:none;padding:6px 10px}
#viewer{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto;flex:none}
.bar button{flex:none;padding:6px 10px}
#ttl{flex:1;min-width:90px;font:inherit;font-weight:600;color:var(--tx);background:none;border:0;padding:6px;-webkit-user-select:text;user-select:text}
.sep{width:1px;height:22px;background:var(--ln);flex:none;margin:0 2px}
.dot{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--ln)}
.dot.on{border-color:var(--tx)}
#zv{min-width:52px}
.main{flex:1;display:flex;min-height:0;position:relative}
#side{width:92px;flex:none;overflow-y:auto;background:var(--sf);border-inline-end:1px solid var(--ln);padding:6px}
@media(min-width:760px){#side{width:128px}}
.th{display:block;width:100%;background:none;border:2px solid transparent;padding:3px;border-radius:8px;margin-bottom:6px;text-align:center}
.th.on{border-color:var(--ac)}
.th canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 0 0 1px var(--ln)}
.th span{font-size:11px;color:var(--mu)}
#scroll{flex:1;overflow:auto;background:var(--desk);direction:ltr;touch-action:none;position:relative}
#pages{position:relative;width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none}
.pg canvas{width:100%;height:100%;display:block;touch-action:none}
#pgno{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;pointer-events:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:rgba(20,28,36,.92);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(380px,100%);background:var(--sf);border-inline-start:1px solid var(--ln);z-index:5;display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.3)}
.tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--ln)}
.tab{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#panel textarea,#panel input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text;width:100%}
#panel textarea{flex:1;min-height:180px;resize:none}
.cd{display:flex;flex-direction:column;gap:2px;border:1px solid var(--ln);border-radius:10px;padding:8px}
.rvc{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:2px dashed var(--ac);border-radius:14px;font-size:18px;cursor:pointer}
#viewer{position:relative}
.pg{position:relative}
.top,.tools{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--sf);border-bottom:1px solid var(--ln);flex:none}
.tools{justify-content:center}
.pill{display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:4px;overflow-x:auto;max-width:100%}
.pill button,.top>button{min-width:44px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;line-height:1.1;flex:none;border-color:transparent;background:none}
.top>button{border-color:var(--ln);background:var(--sf)}
.pill button.on{background:var(--ac2);border-color:var(--ac)}
.pill i{font-style:normal;font-size:20px}.pill small{font-size:10px;color:var(--mu)}
#pop{position:absolute;z-index:8;top:122px;left:50%;transform:translateX(-50%);width:min(430px,94%);max-height:72%;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#pop h3{margin:0 0 6px;text-align:center;font-size:16px}
#pop label{display:block;color:var(--mu);font-size:13px;margin:12px 0 6px}
.rg{display:flex;align-items:center;gap:8px}.rg input[type=range]{flex:1;direction:ltr}.rg button{width:36px;height:36px;border-radius:50%;padding:0}
.seg{display:flex;gap:8px}.seg button{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:10px}.sw .dot{width:36px;height:36px}

function renderList(){
  const kind=x=>x.kind==='pdf'?['PDF','k-pdf','📕']:x.kind==='docx'?['Word','k-doc','📘']:['دفتر','k-nb','📒'];
  const dt=x=>new Date(x.updated).toLocaleDateString('ar',{day:'numeric',month:'short'});
  const q=hq.trim().toLowerCase(),L=notes.filter(x=>!q||x.title.toLowerCase().includes(q));
  $('#hl').innerHTML=L.map(x=>{const k=kind(x);return `<div class="card"><div class="ic ${k[1]}">${k[2]}</div><button class="go" data-open="${x.id}"><b>${esc(x.title)}</b><span>${k[0]} · ${x.pages.length} صفحة · ${dt(x)}</span></button><button class="pin${x.pin?' on':''}" data-pin="${x.id}">★</button><button class="pin" data-shr="${x.id}" title="مشاركة / حفظ">↗</button><button class="del" data-del="${x.id}">حذف</button></div>`}).join('')||`<p class="sub empty">${q?'لا نتائج':'لا توجد ملفات بعد — ارفع ملفاً أو أنشئ دفتراً'}</p>`;
}

  const pn=e.target.closest('[data-pin]');if(pn){const x=notes.find(y=>y.id===pn.dataset.pin);x.pin=!x.pin;await putNote(x);return home()}
  const sh=e.target.closest('[data-shr]');if(sh)return homeShare(sh.dataset.shr);
  if(o)return openNote(o.dataset.open);
  if(d){if(d.dataset.arm){await delNote(d.dataset.del);return home()}d.dataset.arm=1;d.textContent='تأكيد الحذف؟';setTimeout(()=>{if(d.isConnected){delete d.dataset.arm;d.textContent='حذف'}},3000);return}
  if(e.target.closest('#thm')){const d=document.documentElement,dk=d.dataset.theme==='dark';if(dk)delete d.dataset.theme;else d.dataset.theme='dark';await putFile('_theme',dk?'':'dark');document.querySelector('meta[name=theme-color]').content=dk?'#0e7490':'#0f172a';return}
  if(e.target.closest('#acct')){return openAcc()}
  if(e.target.closest('#wb')){const x=mk('لوح شرح',[{h:700,strokes:[],bg:null}],'');x.paper='blank';x.orient='l';await putNote(x);await openNote(x.id,x);pres(true);return}
  if(e.target.closest('#newn')){const x=mk('دفتر جديد',[{h:H,strokes:[],bg:null}],'');x.paper='ruled';await putNote(x);openNote(x.id,x)}
});
const mk=(title,pages,kind)=>({id:Math.random().toString(36).slice(2,14),title,created:Date.now(),updated:Date.now(),paper:'blank',spacing:28,text:'',pages,v:2,kind});

$('#file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)importFile(f)});
async function importFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();toast('جارٍ فتح الملف…',20000);
  try{
    if(ext==='pdf'||f.type==='application/pdf')await impPdf(f);
    else if(ext==='docx')await impDocx(f);
    else if(ext==='json')await impJson(f);
    else if(ext==='doc'){toast('ملفات .doc القديمة غير مدعومة، احفظها كـ .docx وارفعها',4000);return}
    else throw 0;
  }catch(err){console.error(err);
    const why=err===0?'نوع الملف غير مدعوم (PDF أو Word .docx فقط)':(ext==='pdf'&&!window.pdfjsLib)?'مكتبة PDF ما انحمّلت: تأكد إن pdf.min.js و pdf.worker.min.js بنفس مجلد index.html':(ext==='docx'&&!window.mammoth)?'مكتبة Word ما انحمّلت: تأكد من وجود mammoth.min.js':(err&&err.name==='PasswordException')?'الملف محمي بكلمة مرور':(err&&err.name==='InvalidPDFException')?'ملف PDF تالف':String((err&&err.message)||err).slice(0,90);
    toast('تعذّر فتح الملف: '+why,7000)}
}
async function impPdf(f){
  const buf=await f.arrayBuffer(),doc=await pdfjsLib.getDocument({data:buf.slice(0)}).promise,pages=[];
  for(let i=1;i<=doc.numPages;i++){const v=(await doc.getPage(i)).getViewport({scale:1});pages.push({h:Math.round(v.height*W/v.width),strokes:[],bg:null,pdf:i})}
  let st='';try{for(let i=1;i<=doc.numPages&&i<=300;i++){const tc=await(await doc.getPage(i)).getTextContent();st+=tc.items.map(t=>t.str).join(' ')+'\n\n'}}catch(e){}
  const x=mk(f.name.replace(/\.pdf$/i,''),pages,'pdf');x.srcText=st;await putFile(x.id,buf);await putNote(x);openNote(x.id,x);
}
async function impDocx(f){
  const text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value,M=90,LH=50,pages=[];
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.font='30px "Readex Pro",Tahoma,Arial,sans-serif';x.textBaseline='top';
  let y=M;const blank=()=>{x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';y=M},flush=()=>pages.push({h:H,strokes:[],bg:c.toDataURL('image/jpeg',.85)});
  blank();
  for(const p of text.split('\n')){
    if(!p.trim()){y+=LH/2;continue}
    const rtl=/[\u0590-\u08FF]/.test(p);x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';
    const put=l=>{if(y>H-M-LH){flush();blank()}x.fillText(l,rtl?W-M:M,y);y+=LH};
    let line='';
    for(const w of p.split(/\s+/)){const t=line?line+' '+w:w;if(x.measureText(t).width>W-2*M&&line){put(line);line=w}else line=t}
    if(line)put(line);
  }
  flush();
  const nt=mk(f.name.replace(/\.docx$/i,''),pages,'docx');nt.srcText=text;await putNote(nt);openNote(nt.id,nt);
}
async function impJson(f){
  let arr=JSON.parse(await f.text());if(!Array.isArray(arr))arr=[arr];let k=0;
  for(const x of arr){
    if(!x||!Array.isArray(x.pages))continue;
    x.pages.forEach((p,i)=>{p.strokes=p.strokes||[];p.h=p.h||H;if(x.kind==='pdf'&&!p.pdf)p.pdf=i+1});
    if(typeof x.src==='string'&&x.src.startsWith('data:')){const b=await(await fetch(x.src)).arrayBuffer();await putFile(x.id,b);if(/pdf/.test(x.src.slice(0,40))){x.kind='pdf';x.pages.forEach((p,i)=>p.pdf=p.pdf||i+1)}}
    x.src='';x.id=x.id||Math.random().toString(36).slice(2,14);x.kind=x.kind||'';x.paper=x.paper||'blank';x.spacing=x.spacing||28;x.updated=x.updated||Date.now();
    await putNote(x);k++;
  }
  await home();toast('تم استرجاع '+k+' ملف',3000);
}

  p=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(16,28)},k,a.slice(28));GKEY=new TextDecoder().decode(p);await putFile('_prov','gemini');toast('تم تفعيل الذكاء الاصطناعي ✓',2500);return true}
  catch(e){toast(window.crypto&&crypto.subtle?'الرمز غير صحيح':'المتصفح لا يدعم التشفير هنا',3000);return false}}

const gk=async()=>GKEY||await getFile('_gkey');
async function gateAI(){if(AIOK)return true;const c=await ask('أدخل رمز الذكاء الاصطناعي','الرمز');if(!c)return false;if(await unlock(c)){AIOK=true;return true}return false}
async function tab(k){if(k==='a'){if(!await gateAI())return}else{AIOK=false;GKEY=null}tab0(k)}

function toPages(r){const t=(r.t+'\n\n'+r.text).replace(/\s+\n/g,'\n'),ch=[];let cur='';
  t.split(/(?<=[.!?؟\n])\s*/).forEach(x=>{if((cur+x).length>1000&&cur){ch.push(cur);cur=''}cur+=x+' '});if(cur.trim())ch.push(cur);
  ch.forEach(c=>{const p=addPage('ruled'),i=n.pages.length-1,o={k:'t',x:50,y:60,w:900,s:28,c:'#1a1a1a',text:c.trim()};p.objs.push(o);mkObj(i,o)});
  touch();toast('تمت كتابة التسجيل على '+ch.length+' صفحة جديدة بنهاية الملف',3500)}

async function homeShare(id){const x=notes.find(y=>y.id===id);if(!x)return;
  const it=[['📄 نسخة PDF فيها كتابتي ورسمي',async()=>{await openNote(id);if(x.kind==='pdf')for(let t=0;t<60&&bgs.filter(Boolean).length<n.pages.length;t++)await new Promise(r=>setTimeout(r,250));
      const b=await mkPdf();toast('جاهز',800);await deliver(b,x.title+'.pdf');$('#back').click()}]];
  if(x.kind==='pdf'||x.kind==='docx')it.push(['📎 الملف الأصلي',async()=>{const buf=await getFile(id);if(!buf)return toast('الملف الأصلي غير موجود');deliver(new Blob([buf],{type:x.kind==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),x.title+(x.kind==='pdf'?'.pdf':'.docx'))}]);
  it.push(['📝 ملف دراسة (ملاحظات + بطاقات + تفريغ)',()=>{const o=n;n=x;const t=studyTxt();n=o;deliver(new Blob([t],{type:'text/plain'}),x.title+'.txt')}]);
  menu(x.title,it)}

function qzShow(){const B=$('#qbox'),Q=QZ;
  if(Q.i>=Q.q.length){B.innerHTML='<div class="cd"><b>نتيجتك: '+Q.s+' / '+Q.q.length+'</b></div>'+(Q.w.length?'<button id="qw">أضف الأسئلة الخاطئة كبطاقات مراجعة</button>':'')+'<button id="qr">اختبار جديد</button>';
    if(Q.w.length)$('#qw').onclick=()=>{(n.cards=n.cards||[]).push(...Q.w.map(x=>({q:x.q,a:x.o[x.a]+(x.e?' — '+x.e:'')})));touch();cards();toast('أُضيفت '+Q.w.length+' بطاقة');$('#qw').remove()};
    $('#qr').onclick=()=>$('#qz').click();return}
  const x=Q.q[Q.i];B.innerHTML='<div class="cd"><b>'+(Q.i+1)+'/'+Q.q.length+' — '+esc(x.q)+'</b></div>'+x.o.map((o,k)=>'<button class="qo" data-k="'+k+'" style="display:block;width:100%;text-align:start;margin:6px 0">'+esc(o)+'</button>').join('')+'<div id="qe"></div>';
  B.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;B.querySelectorAll('.qo').forEach(y=>{y.disabled=true;if(+y.dataset.k===x.a){y.style.background='#bbf7d0';y.style.color='#111'}});
    if(k===x.a)Q.s++;else{b.style.background='#fecaca';b.style.color='#111';Q.w.push(x)}
    $('#qe').innerHTML='<p class="sub">'+esc(x.e||'')+'</p><button id="qn">'+(Q.i+1<Q.q.length?'التالي':'النتيجة')+'</button>';$('#qn').onclick=()=>{Q.i++;qzShow()}})}

/* ---------- server: stats, updates, permissions ---------- */
const APP_VER=9;                       /* = versionCode بالـ APK */
const API='https://daftari.1adam0adam0.workers.dev';   /* رابط السيرفر (Cloudflare Worker) */
const FEAT={ai:['#aib','[data-tab=a]','[data-tab=q]'],rec:['#recb','[data-tab=r]'],yt:['#yt'],split:['#split'],pres:['#pres'],prn:['#prn'],tmr:['#tmr'],txt:['#txt']};
async function did(){let d=await getFile('_did');if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(14)),b=>(b%36).toString(36)).join('');await putFile('_did',d)}return d}
function fillDid(){fillSup();getFile('_did').then(d=>{const e=$('#didl');if(e&&d)e.textContent='معرّف جهازك: '+d}).catch(()=>{})}
function applyCfg(j){
  const f=j.features||{};
  for(const k in FEAT)FEAT[k].forEach(q=>document.querySelectorAll(q).forEach(e=>{e.style.display=f[k]===false?'none':''}));
  if(j.blocked&&!$('#blk')){const d=document.createElement('div');d.id='blk';d.style.cssText='position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:20px;text-align:center;color:#fff;font-size:17px';d.textContent='تم إيقاف استخدام هذا الجهاز. تواصل مع الدعم.';document.body.append(d)}
}
/* ---------- support chat ---------- */
let SUPN=0;
const apiOK=()=>!API.includes('YOUR-WORKER');
function supBadge(){const e=$('#supn');if(e){e.textContent=SUPN>0?SUPN:'';e.style.display=SUPN>0?'inline-block':'none'}}
async function pollUnread(){try{if(!apiOK())return;const r=await fetch(API+'/api/chat/unread?id='+await did());if(r.ok){SUPN=(await r.json()).unread||0;supBadge()}}catch(e){}}
setInterval(()=>{if(!document.hidden)pollUnread()},90000);
function fillSup(){const h=$('#home');if(!h||$('#supb'))return;const b=document.createElement('button');b.id='supb';b.style.cssText='position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:14px;z-index:20;padding:12px 16px;border-radius:99px;background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.3)';b.innerHTML='💬 الدعم <b id="supn" style="background:#ef4444;border-radius:99px;padding:0 7px;margin-inline-start:4px;display:none"></b>';b.onclick=openSup;h.append(b);supBadge()}
async function openSup(){
  if(!apiOK())return toast('الخدمة غير متاحة حالياً');
  const id=await did(),d=document.createElement('div');d.id='sup';
  d.style.cssText='position:fixed;inset:0;z-index:98;background:var(--bg);color:var(--tx);display:flex;flex-direction:column';
  d.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln)"><b style="flex:1">💬 الدعم</b><button id="sx">✕</button></div><div id="sm" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px"><p id="sh" class="sub" style="text-align:center">اكتب سؤالك أو مشكلتك وسنرد عليك هنا.</p></div><div style="display:flex;gap:8px;padding:10px;background:var(--sf);border-top:1px solid var(--ln)"><input id="si" placeholder="اكتب رسالتك…" style="flex:1" maxlength="1000"><button id="ss" style="background:var(--ac);color:#fff;border-color:var(--ac)">إرسال</button></div>';
  document.body.append(d);
  let last=0;
  const draw=async()=>{try{const r=await fetch(API+'/api/chat/list?id='+id+'&after='+last);if(!r.ok)return;const L=await r.json();if(!L.length)return;const m=$('#sm'),h=$('#sh');if(h)h.remove();
    L.forEach(x=>{last=Math.max(last,x.id);const b=document.createElement('div');b.style.cssText='max-width:80%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;'+(x.from_admin?'align-self:flex-end;background:var(--sf);border:1px solid var(--ln)':'align-self:flex-start;background:var(--ac);color:#fff');b.textContent=x.text;m.append(b)});
    m.scrollTop=m.scrollHeight;SUPN=0;supBadge()}catch(e){}};
  const send=async()=>{const i=$('#si'),t=i.value.trim();if(!t)return;i.value='';
    try{const r=await fetch(API+'/api/chat/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,text:t})});
      if(!r.ok){toast(r.status===429?'رسائل كثيرة، انتظر قليلاً':'تعذّر الإرسال',3000);i.value=t;return}draw()}
    catch(e){toast('تعذّر الإرسال، تأكد من الإنترنت',3000);i.value=t}};
  const tm=setInterval(draw,6000);
  $('#sx').onclick=()=>{clearInterval(tm);d.remove()};$('#ss').onclick=send;$('#si').onkeydown=e=>{if(e.key==='Enter')send()};
  draw();
}
async function checkUpdate(){
  let j=null;
  try{
    if(!API.includes('YOUR-WORKER')){
      const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
      const r=await fetch(API+'/api/ping',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:await did(),ver:APP_VER,token:await tokenGet()}),signal:c.signal});clearTimeout(t);
      if(r.ok){j=await r.json();await putFile('_cfg',JSON.stringify(j))}
    }
  }catch(e){}
  if(!j){try{j=JSON.parse((await getFile('_cfg'))||'null')}catch(e){}}
  if(!j)return;
  if(j.auth===false){await putFile('_acct','');await authGate()}
  applyCfg(j);SUPN=j.unread||0;supBadge();
  const R=j.release||{};
  if(R.url&&+R.versionCode>APP_VER)showUpd(R,R.url,!!(R.minVersion&&APP_VER<+R.minVersion));
}
function showUpd(j,link,must){
  if($('#upd'))return;
  const d=document.createElement('div');d.id='upd';
  d.style.cssText='position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px';
  d.innerHTML='<div style="background:var(--sf);color:var(--tx);border-radius:18px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)"><h3 style="margin:0">🚀 يوجد تحديث جديد'+(j.versionName?' ('+esc(j.versionName)+')':'')+'</h3><p style="margin:0;font-size:14px;white-space:pre-wrap">'+'يرجى تحديث التطبيق عبر الزر أدناه للحصول على آخر نسخة.'+(j.notes?'\n\n'+esc(j.notes):'')+'</p><p style="margin:0;font-size:12px;color:var(--mu)">ملفاتك وملاحظاتك رح تبقى كما هي بعد التحديث.</p><button id="ugo" style="background:var(--ac);color:#fff;border-color:var(--ac)">تحديث الآن</button>'+(must?'':'<button id="ult">لاحقاً</button>')+'</div>';
  document.body.append(d);
  d.querySelector('#ugo').onclick=async()=>{
    if(window.Android&&Android.open){Android.open(link);return}
    const b=d.querySelector('#ugo').parentNode;
    try{await navigator.clipboard.writeText(link);toast('تم نسخ الرابط، افتحه بالمتصفح',4000)}catch(e){}
    if(!b.querySelector('input')){const i=document.createElement('input');i.readOnly=true;i.value=link;i.style.cssText='width:100%;direction:ltr';b.append(i);i.select()}};
  const l=d.querySelector('#ult');if(l)l.onclick=()=>d.remove();
}

/* ---------- accounts: login / signup / guest (password stored hashed on the server) ---------- */
const TERMS_V=1;
const TERMS_TXT=`شروط الاستخدام وسياسة الخصوصية — تطبيق «دفتري»

1) الاستخدام
دفتري تطبيق لتنظيم الملاحظات والمستندات والدراسة. باستخدامك له فأنت توافق على هذه الشروط. التطبيق مخصّص لمن عمره 13 سنة فأكثر.

2) البيانات التي نجمعها
• عند إنشاء حساب: الاسم، البريد الإلكتروني، سنة الميلاد، الجنس (اختياري)، وكلمة المرور (تُحفظ مشفّرة ولا يمكن لأي شخص قراءتها).
• بيانات تقنية: معرّف عشوائي للجهاز، رقم نسخة التطبيق، تاريخ آخر استخدام.
• رسائل الدعم التي ترسلها بنفسك.
• عند الدخول كضيف لا نجمع اسمك ولا بريدك، لكن يُسجَّل المعرّف التقني للجهاز.

3) ملفاتك وملاحظاتك
تُحفظ على جهازك فقط ولا تُرفع إلى سيرفراتنا.

4) ميزات الذكاء الاصطناعي
عند استخدامك لها يُرسل المحتوى الذي تختاره إلى مزوّد الخدمة (مثل Google Gemini أو Anthropic Claude) لمعالجته، وتخضع هذه البيانات لسياسات المزوّد.

5) كيف نستخدم بياناتك
لتشغيل الحساب والدعم الفني وتحسين التطبيق وإرسال إشعارات التحديث. لا نبيع بياناتك لأي طرف.

6) حقوقك
يمكنك طلب حذف حسابك وبياناتك في أي وقت عبر الدعم داخل التطبيق.

7) إيقاف الحساب
يحق لنا إيقاف أي حساب أو جهاز يسيء استخدام التطبيق.

8) التعديلات
قد نحدّث هذه الشروط، وسنُعلمك داخل التطبيق عند حدوث تغيير جوهري.`;
async function tokenGet(){try{const a=JSON.parse((await getFile('_acct'))||'null');return a&&a.token||''}catch(e){return ''}}
function showTerms(){
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px';
  d.innerHTML='<div style="background:var(--sf);color:var(--tx);border-radius:18px;max-width:440px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden"><div style="padding:16px 18px;font-weight:700;border-bottom:1px solid var(--ln)">الشروط وسياسة الخصوصية</div><div id="tt" style="padding:14px 18px;overflow:auto;white-space:pre-wrap;font-size:14px;line-height:1.8"></div><div style="padding:12px 18px;border-top:1px solid var(--ln)"><button id="tc" class="au-b au-p">فهمت</button></div></div>';
  d.querySelector('#tt').textContent=TERMS_TXT;d.querySelector('#tc').onclick=()=>d.remove();document.body.append(d)}
function authGate(){return new Promise(async res=>{
